[project]
name = "semsheet"
version = "0.1.0"
description = "Semantic Sheet: plain-language operations over uploaded tables, planned by a frontier model, judged row by row on TypeSafe Jev, computed exactly in DuckDB, served over a web API and MCP."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "duckdb>=1.5",
  "pyarrow>=17",
  "pandas>=2.2",
  "httpx>=0.27",
  "mcp>=2.0",
  "openai>=1.50",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
